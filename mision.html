<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>APAGÓN · Misión</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    .reto { font-size: 1.02rem; line-height: 1.5; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
    .team-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; margin: 6px 0; text-align: left; }
    .team-btn.done { opacity: .55; }
  </style>
  <link rel="stylesheet" href="camp.css?v=camp-2026-1">
</head>
<body class="page-mision">
  <div class="top">
    <div id="brand"></div>
    <div class="net" id="net">…</div>
  </div>
  <header class="camp-hero"><div><span class="camp-eyebrow">ESTACIÓN DE AVENTURA</span><h1>Puesto de misión</h1><p>El mejor recurso de esta expedición es trabajar juntos.</p><span class="camp-label">Retos junto a la fogata</span></div></header>
  <div class="status-banner" id="statusBanner"></div>

  <div class="card">
    <label class="muted" for="mission">¿Qué misión atendés?</label>
    <select id="mission"></select>
  </div>

  <div class="card" id="missionCard">
    <h3 id="mTitle"></h3>
    <p class="reto" id="mReto"></p>
    <div class="meta" id="mMeta"></div>
  </div>

  <button class="primary big" id="scanBtn">✅ LO LOGRARON · ESCANEAR TARJETA</button>
  <p class="muted" style="text-align:center;margin:8px 0 0;font-size:.85rem">Escaneá la tarjeta del equipo (la tiene el Portador) solo si completaron el reto.</p>

  <div class="card">
    <h3>Equipos</h3>
    <div id="teams"></div>
    <p class="muted" style="font-size:.8rem;margin:8px 0 0">Si la cámara no funciona, tocá el equipo para registrarlo a mano.</p>
  </div>

  <div id="result" class="overlay hidden">
    <div class="big-icon" id="resultIcon"></div>
    <div class="big-text" id="resultText"></div>
    <button class="primary" id="resultOk" style="max-width:220px">OK</button>
  </div>

  <script type="module" src="js/mision.js"></script>
</body>
</html>
